name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app (for custom domain root)
        run: |
          # Always use root path for custom domain deployment
          BASE="/"
          echo "Using base href: $BASE"
          npx ng build --base-href "$BASE"

      - name: Detect dist folder and add SPA fallback (404.html)
        id: detect_dist
        run: |
          set -e
          REPO_NAME="${{ github.event.repository.name }}"
          # Try common Angular output locations
          if [ -f dist/browser/index.html ]; then
            DIST_DIR="dist/browser"
          elif [ -f "dist/$REPO_NAME/browser/index.html" ]; then
            DIST_DIR="dist/$REPO_NAME/browser"
          elif [ -f "dist/$REPO_NAME/index.html" ]; then
            DIST_DIR="dist/$REPO_NAME"
          elif [ -f dist/index.html ]; then
            DIST_DIR="dist"
          else
            echo "Could not find built index.html in dist. Contents:" >&2
            find dist -maxdepth 3 -type f -name 'index.html' -print || true
            exit 1
          fi
          echo "Using DIST_DIR=$DIST_DIR"
          echo "dist_dir=$DIST_DIR" >> "$GITHUB_OUTPUT"
          cp "$DIST_DIR/index.html" "$DIST_DIR/404.html"
          touch "$DIST_DIR/.nojekyll"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.detect_dist.outputs.dist_dir }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
