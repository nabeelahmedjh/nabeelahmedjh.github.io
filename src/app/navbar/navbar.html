<nav class="navbar">
    <!-- Desktop Navigation -->
    <div class="desktop-nav">
        <div class="nav nav-shell flex items-center justify-between">
            <div class="logo name flex-shrink-0">NJ</div>
            <ul class="flex items-center gap-4 text-lg nav-items flex-1 justify-center">
                <li><a href="#home-section" (click)="navigateToSection($event, '#home-section')" [class.active-link]="currentSection === '#home-section'" [attr.aria-current]="currentSection === '#home-section' ? 'page' : null">Overview</a></li>
                <li *ngIf="showVolunteering"><a href="#volunteering-section" (click)="navigateToSection($event, '#volunteering-section')" [class.active-link]="currentSection === '#volunteering-section'" [attr.aria-current]="currentSection === '#volunteering-section' ? 'page' : null">Leadership</a></li>
                <li *ngIf="showProjects"><a href="#experience-section" (click)="navigateToSection($event, '#experience-section')" [class.active-link]="currentSection === '#experience-section'" [attr.aria-current]="currentSection === '#experience-section' ? 'page' : null">Professional Experience</a></li>
                <li *ngIf="showProjects"><a href="#projects-section" (click)="navigateToSection($event, '#projects-section')" [class.active-link]="currentSection === '#projects-section'" [attr.aria-current]="currentSection === '#projects-section' ? 'page' : null">Projects</a></li>
                <li *ngIf="showBlog"><a href="https://nabeelahmedjh.hashnode.dev/" target="_blank">Blog</a></li>
                <li *ngIf="showMedia"><a href="#media">Media</a></li>
            </ul>
            <div class="logo resume flex-shrink-0">
                <button type="button" (click)="openHireDialog($event)" aria-haspopup="dialog" [attr.aria-expanded]="isHireDialogOpen">Hire me</button>
            </div>
        </div>
    </div>

    <!-- Mobile Navigation -->
    <div class="mobile-nav">
        <div class="mobile-nav-header flex items-center justify-between p-4">
            <div class="logo name">NJ</div>
            <button class="hamburger-menu" (click)="toggleMobileMenu()" [class.active]="isMobileMenuOpen">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
        
        <!-- Mobile Menu Overlay -->
        <div class="mobile-menu-overlay" [class.active]="isMobileMenuOpen" (click)="closeMobileMenu()" (keydown.escape)="closeMobileMenu()">
            <ul class="mobile-nav-items">
                <li><a href="#home-section" (click)="navigateToSection($event, '#home-section')">Overview</a></li>
                <li *ngIf="showVolunteering"><a href="#volunteering-section" (click)="navigateToSection($event, '#volunteering-section')">Leadership</a></li>
                <li *ngIf="showProjects"><a href="#experience-section" (click)="navigateToSection($event, '#experience-section')">Professional Experience</a></li>
                <li *ngIf="showProjects"><a href="#projects-section" (click)="navigateToSection($event, '#projects-section')">Projects</a></li>
                <li *ngIf="showBlog"><a href="https://nabeelahmedjh.hashnode.dev/" target="_blank" (click)="closeMobileMenu()">Blog</a></li>
                <li *ngIf="showMedia"><a href="#media" (click)="closeMobileMenu()">Media</a></li>
                <li><button type="button" class="mobile-hire-btn" (click)="openHireDialog($event)" aria-haspopup="dialog" [attr.aria-expanded]="isHireDialogOpen">Hire me</button></li>
            </ul>
        </div>
    </div>
</nav>

<!-- Hire me dialog -->
<div class="hire-dialog-backdrop" *ngIf="isHireDialogOpen" (click)="closeHireDialog()" role="presentation">
    <div class="hire-dialog" role="dialog" aria-modal="true" aria-labelledby="hire-dialog-title" (click)="$event.stopPropagation()">
        <div class="hire-dialog-header">
            <h2 id="hire-dialog-title">Get in touch</h2>
            <button type="button" class="hire-dialog-close" (click)="closeHireDialog()" aria-label="Close dialog">
                <fa-icon [icon]="faTimes"></fa-icon>
            </button>
        </div>
        <ul class="hire-dialog-list">
            <li *ngFor="let link of hireLinks">
                <a [href]="link.url" target="_blank" rel="noopener noreferrer" (click)="closeHireDialog()">
                    <fa-icon [icon]="link.icon"></fa-icon>
                    <span>{{ link.label }}</span>
                </a>
            </li>
        </ul>
    </div>
</div>
